[project]
name = "tiny-desk-radio"
version = "0.1.0"
description = "Turn a Tiny Desk YouTube channel into per-song, tagged M4A files for Apple Music, so every artist can be shuffled like a radio."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexandre Lima" }]
requires-python = ">=3.12,<3.13"
keywords = ["tiny-desk", "youtube", "apple-music", "yt-dlp", "whisper", "m4a"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "ai-edge-litert>=1.2",
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mutagen>=1.48.1",
    "numpy>=2.0",
    "yt-dlp>=2026.10.26",
]

[project.urls]
Homepage = "https://github.com/alexandrevl/tiny-desk-radio"
Issues = "https://github.com/alexandrevl/tiny-desk-radio/issues"
Changelog = "https://github.com/alexandrevl/tiny-desk-radio/blob/main/CHANGELOG.md"

[project.scripts]
tinydesk = "tinydesk.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinydesk"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
